  if(!text)return null;
  const canon=canonicalLooseIngredient(text, it.qty!=null&&it.qty!==''?it.qty:'', it.unit||'');
  if(!canon.name)return null;
  // collectWeekGrocery normalizes (lemon juice -> lemons, chickpea cans, garlic cloves).
  return{qty:canon.qty,unit:canon.unit||'',name:canon.name};
}
const GROCERY_GROUP_ORDER=['meat','seafood','produce','dairy','bakery','pantry','other'];
const GROCERY_GROUP_LABEL={meat:'Meat',seafood:'Seafood',produce:'Produce',dairy:'Dairy',bakery:'Bakery',pantry:'Pantry',other:'Other'};
/**
 * Aisle from the ingredient name. First hit wins.
 * Bakery / dairy / pantry come before meat and produce so "potato bun",
 * "beef stock", and "tomato sauce" stay in the aisle you buy them from.
 * Poultry is meat. Seafood is its own group (checked before meat).
 */
function groceryGroup(name){
  const n=normGroceryName(name);
  if(!n)return 'other';
  if(/\b(breads?|buns?|tortillas?|rolls?|breadcrumbs?)\b/.test(n))return 'bakery';
  if(/\b(coconut\s+(milk|cream)|beans?|chickpeas?|lentils?|peanut\s+butter|powder|dried|seasoning|flakes)\b/.test(n)||/\bground\s+(ginger|cumin|cinnamon|coriander|nutmeg|cloves?|turmeric|allspice|black\s+pepper)\b/.test(n))return 'pantry';
  if(/\b(cheeses?|creams?|milks?|butters?|yogh?urts?|parmesans?|parmigiano)\b/.test(n))return 'dairy';
  if(/\b(pastas?|rices?|sauces?|oils?|vinegars?|wines?|stocks?|broths?|bouillons?|spices?|flours?|sugars?|cans?|canned|beans?)\b/.test(n))return 'pantry';
  if(SEAFOOD_RE.test(n)||/\banchov(?:y|ies)\b/.test(n))return 'seafood';
  if(/\b(chicken|turkey|poultry|ducks?|beef|pork|lamb|steaks?|sausages?|bacon|veal|bison|meats?|chucks?|briskets?|pancetta|guanciale|prosciutto|oxtails?|ribeyes?|short ribs?|hams?|pepperoni|thighs?|cutlets?)\b/.test(n))return 'meat';
  if(/\b(vegetables?|fruits?|herbs?|onions?|garlics?|peppers?|tomato(?:es)?|potato(?:es)?|lemons?|limes?|ginger|spinach|kale|lettuce|arugula|cabbage|broccoli|cauliflower|carrots?|celery|cucumbers?|zucchini|eggplants?|mushrooms?|shallots?|scallions?|cilantro|parsley|basil|dill|mint|avocados?|jalape[nñ]os?|corn)\b/.test(n))return 'produce';
  return 'other';
}
function groceryGroupRank(g){
  const i=GROCERY_GROUP_ORDER.indexOf(g);
  return i<0?GROCERY_GROUP_ORDER.length:i;
}

function collectWeekGrocery(w){
  if(!w)return[];
  const rows=[];
  const seen=new Set();
  slotsOf(w).forEach(slot=>{
    const items=((w[slot]||{}).items)||[];
    items.forEach(it=>{
      if(isIngredientItem(it)){
        const id=it.id?String(it.id):normGroceryName(it.text)+'|'+normGroceryUnit(it.unit)+'|'+String(it.qty==null?'':it.qty);
        const k=slot+'|ing|'+id;
        if(seen.has(k))return;
        seen.add(k);
        const row=looseGroceryRow(it);
        if(row)rows.push(row);
        return;
      }
      if(!it||!it.rid)return;
      const k=slot+'|rid|'+it.rid;
      if(seen.has(k))return;
      seen.add(k);
      const r=S.recipes.find(x=>x.id===it.rid);
      if(!r)return;
      _ppl=Number((w[slot]||{}).people)||0;
      try{recipeGroceryRows(r).forEach(row=>rows.push(row))}finally{_ppl=undefined}
    });
  });
  // Same ingredient = normalized name + unit family: tsp/tbsp/cup add up, g/oz/lb add up; counts stay separate.
  const map=new Map();
  rows.forEach(row=>{
    const normalized=normalizeGroceryRow(row);
    if(!normalized)return;
    if(isTapWater(normalized.name))return; // nobody shops for water
    garlicToCloves(normalized);
    const name=sentenceCaseIngredient(normalized.name);
    const nKey=normGroceryName(name);
    if(!nKey)return;
    const uKey=normGroceryUnit(normalized.unit);
    const fam=UNIT_FAMILY[uKey];
    const key=nKey+'|'+(fam?fam.f:uKey);
    const qty=normalized.qty!=null&&normalized.qty!==''&&Number.isFinite(Number(normalized.qty))?Number(normalized.qty):null;
    const prev=map.get(key);
    if(!prev){
      map.set(key,{qty,unit:uKey,name,key,base:fam&&qty!=null?qty*fam.x:null,units:[uKey]});
      return;
    }
    if(fam){
      if(qty!=null)prev.base=(prev.base||0)+qty*fam.x;
      if(!prev.units.includes(uKey))prev.units.push(uKey);
      return;
    }
    if(prev.qty!=null&&qty!=null){
      prev.qty=Math.round((prev.qty+qty)*1000)/1000;
    }else if(prev.qty==null&&qty!=null){
      prev.qty=qty;
    }
  });
  map.forEach(row=>{
    if(row.base==null||!UNIT_FAMILY[row.unit])return;
    // Show the total in the biggest unit used that still reads as at least 1 (2 tbsp + 2 tsp → 2 2/3 tbsp).
    const units=row.units.filter(u=>UNIT_FAMILY[u]).sort((a,b)=>UNIT_FAMILY[b].x-UNIT_FAMILY[a].x);
    const u=units.find(x=>row.base/UNIT_FAMILY[x].x>=1)||units[units.length-1];
    row.unit=u;row.qty=Math.round(row.base/UNIT_FAMILY[u].x*1000)/1000;
    row.key=normGroceryName(row.name)+'|'+u;
    delete row.base;delete row.units;
  });
  map.forEach(row=>{delete row.base;delete row.units});
  return[...map.values()].map(row=>{
    row.group=groceryGroup(row.name);
    return row;
  }).sort((a,b)=>{
    const ga=groceryGroupRank(a.group), gb=groceryGroupRank(b.group);
    if(ga!==gb)return ga-gb;
    const nc=a.name.localeCompare(b.name,undefined,{sensitivity:'base'});
    if(nc)return nc;
    return String(a.unit||'').localeCompare(String(b.unit||''));
  });
}
function fmtGroceryLine(row){
  if(!row)return'';
  return formatIngredientParts(row.qty, row.unit, row.name);
}
/* Shop at HEB: each grocery item links to HEB's search for just the item (no amounts or prep notes). */
function storeTerm(name){
  let t=String(name||'');
  const col=(t.match(/\((red|white|yellow|green|sweet|purple)\)/i)||[])[1];
  t=t.replace(/\([^)]*\)/g,' ');
  t=t.split(/,|;| - | – /)[0];
  t=t.replace(/\b(to taste|optional|for serving|divided|plus more.*$)\b/gi,' ');
  t=t.replace(/^\s*(juice|zest)\s+of\s+(the\s+)?/i,'').replace(/^\s*(a\s+)?(handfuls?|pinch|dash|sprigs?|bunch(es)?)(\s+of)?\s+/i,'');
  t=t.replace(/^\s*[\d\/.½¼¾⅓⅔]+\s*/,'').replace(/^\s*(extra[- ]large|large|medium|small|big)\s+/i,'');
  t=t.replace(/\s+/g,' ').trim();
  if(col&&t&&!new RegExp('\\b'+col+'\\b','i').test(t))t=col.toLowerCase()+' '+t;
  return t||String(name||'').trim();
}

async function writeClipboard(text){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=text;
    document.body.appendChild(ta);
    ta.select();
    const copied=document.execCommand('copy');
    ta.remove();
    return !!copied;
  }catch(e2){return false}
}
function groceryQtyText(row){

function recipeSheetGrocery(r){
  if(!r)return '';

  const merged=new Map();
  recipeGroceryRows(r).forEach(row=>{

    const prev=merged.get(k);

function groupedGroceryText(rows){
  let text='', last='';
  (rows||[]).forEach(row=>{
    const line=fmtGroceryLine(row);
    if(!line)return;
    const g=row.group||groceryGroup(row.name);
    if(g!==last){
      if(text)text+='\n';
      text+='['+String(GROCERY_GROUP_LABEL[g]||'Other').toUpperCase()+']\n';
      last=g;
    }

  });

}

/** Fill empty daily plates with picks that fit the preferences and vary the protein day to day. */
function fillWeek(){
  const w=getWeek();if(!w)return;
  const slots=emptyFillable(w);if(!slots.length){showToast('Nothing to fill');return}
  const aff=tagAffinity();const used=weekUsedRids(w);const recentKinds=recentMeatKinds(w.id);
  const pool=S.recipes.filter(r=>r&&!prefBlockReason(r)&&plannedRecipeRole(r)!=='add-on');
  if(!pool.length){showToast('No recipes fit your preferences yet');return}
  const before={};slots.forEach(k=>before[k]=w[k]?JSON.parse(JSON.stringify(w[k])):null);
  const chosen=[];let filled=0;
  slots.forEach(k=>{
    const d=slotDay(k);
    const near=chosen.filter(c=>Math.abs(c.d-d)<=1).map(c=>c.kind);
    let best=null,bs=-1e9;
    pool.forEach(r=>{
      if(used.includes(r.id)||chosen.some(c=>c.id===r.id))return;
      let sc=score(r,aff,used,{recentKinds,otherKind:null}).sc;
      const kind=meatKind(r);
      if(near.includes(kind)&&kind!=='other')sc-=3;
      if(sc>bs){bs=sc;best=r}
    });
    if(!best)return;
    chosen.push({id:best.id,d,kind:meatKind(best)});
    applySuggestPick(w,k,{recipe:best,why:'filled from your preferences'});filled++;
  });
  if(!filled){showToast('Ran out of recipes to suggest');return}
  save({flush:true});render();
  showToast(`Filled ${filled} ${filled===1?'meal':'meals'}`,()=>{const w2=(S.weeks||[]).find(x=>x.weekOf===w.weekOf);if(!w2)return;Object.entries(before).forEach(([k,v])=>{if(v)w2[k]=v;else delete w2[k]});save({flush:true});render()});
}

function plateNoteOf(w,slot){
  const p=w&&w[slot];const exact=slotDay(slot)!=null?slotDate(w,slot):null;
  const rids=plateRids((p&&p.items)||[]);
  const logs=rids.map(rid=>primaryLogForWeekRid(w.weekOf,rid)).filter(Boolean).filter(l=>!exact||l.date===exact);
  const flagged=logs.find(l=>l.plateNote&&l.note);
  if(flagged)return{text:flagged.note,log:flagged,logs};
  // older logs copied one note onto every recipe: treat a note shared by 2+ recipes as the plate's
  const cnt={};logs.forEach(l=>{if(l.note)cnt[l.note]=(cnt[l.note]||0)+1});
  const shared=Object.keys(cnt).find(k=>cnt[k]>1);
  return{text:shared||'',log:shared?logs.find(l=>l.note===shared):logs[0]||null,logs};
}

      else if(/\bchicken\b/i.test(blob))pushUnique(g.meat,'chicken');
      else pushUnique(g.meat,'chicken');
    }else if(k==='red'){
      if(/\bpork|ribs?\b/i.test(blob))pushUnique(g.meat,'pork');
      else if(/\blamb\b/i.test(blob))pushUnique(g.meat,'lamb');
      else if(/\bsausages?\b/i.test(blob))pushUnique(g.meat,'pork');
      else if(/\bbeef|steak|chuck|braciole|veal\b/i.test(blob))pushUnique(g.meat,'beef');
    }else if(k==='fish')pushUnique(g.meat,'fish');

    if(st.bowl||/\b(stew|braised?|skillet|stir[- ]?fr(y|ied)|pot roast|one[- ]pot|ragu|stroganoff|curry)\b/i.test(name))pushUnique(g.mode,'slop');

    if(/\b(potato|potatoes)\b(?!\s+(starch|flakes))/i.test(blob))pushUnique(g.carb,'potato');
  }

    const F=[['tomatoey',/\b(marinara|crushed tomatoes|tomato sauce|whole peeled tomatoes|san marzano|sunday sauce|pizzaiola|bolognese|fra diavolo|arrabbiata|ragu)\b/i],

      ['bright',/\b(piccata|francese|lemon|lime|vinegar|capers|salsa verde|gremolata|chimichurri)\b/i],
      ['umami',/\b(soy sauce|miso|fish sauce|anchov(y|ies)|mushrooms?|oyster sauce|worcestershire)\b/i],
      ['fresh',/\b(salad|slaw|cucumber|crudo|ceviche)\b/i]];

/** Tags are only the chip values in TAG_CANON. Old names that mean a chip
    (bake, fish, steak, greek...) become that chip; anything else is dropped. */
function canonicalTags(list){
  const picked=new Set();const cuis=[];
  (Array.isArray(list)?list:String(list||'').split(',')).forEach(raw=>{
    const c=classifyStoredTag(raw);
    if(c){picked.add(c.value);if(c.group==='cuisine'&&!cuis.includes(c.value))cuis.push(c.value)}
  });
  // One cuisine per recipe. Two old ones that make a known mix (Italian + American) become the mix.
  if(cuis.length>1){
    let keep=cuis[0];
    for(const [pair,mix] of CUISINE_MIXES){if(TAG_CANON.cuisine[mix]&&pair.every(x=>cuis.includes(x))){keep=mix;break}}
    cuis.forEach(c=>picked.delete(c));picked.add(keep);
  }
  const fl=[];(Array.isArray(list)?list:String(list||'').split(',')).forEach(raw=>{const c=classifyStoredTag(raw);if(c&&c.group==='flavor'){const i=fl.indexOf(c.value);if(i>=0)fl.splice(i,1);fl.push(c.value)}});
  fl.slice(0,-2).forEach(v=>picked.delete(v));
  const out=[];
  TAG_GROUP_ORDER.forEach(g=>Object.keys(TAG_CANON[g]).forEach(v=>{if(picked.has(v))out.push(v)}));
  return out;
}
function normalizeRecipeTags(r){
  if(!r)return;
  r.tags=canonicalTags(r.tags);
}
function toggleRecipeGroupTag(id,group,value){
  const r=S.recipes.find(x=>x.id===id);if(!r)return;
  if(!TAG_GROUP_ORDER.includes(group)||!TAG_CANON[group]||!TAG_CANON[group][value])return;
  if(!Array.isArray(r.tags))r.tags=[];
  const aliases=new Set([value,...(TAG_CANON[group][value]||[]).map(a=>String(a).toLowerCase())]);
  const has=r.tags.some(t=>{
    const low=String(t).toLowerCase();
    if(aliases.has(low))return true;
    const c=classifyStoredTag(t);
    return !!(c&&c.group===group&&c.value===value);
  });
  if(has){
    r.tags=r.tags.filter(t=>{
      const low=String(t).toLowerCase();
      if(aliases.has(low))return false;
      const c=classifyStoredTag(t);
      if(c&&c.group===group&&c.value===value)return false;
      return true;
    });
  }else{
    if(group==='cuisine')r.tags=r.tags.filter(t=>{const c=classifyStoredTag(t);return !(c&&c.group==='cuisine')});
    r.tags.push(value);
  }
  normalizeRecipeTags(r);
  save({flush:true});render();
}

function cropStart(e,id){

async function resizeImageFile(file,maxSide=1200,quality=0.82){
  if(!file||!file.type||!file.type.startsWith('image/'))throw new Error('Not an image');
  const bmp=await createImageBitmap(file);
  let w=bmp.width,h=bmp.height;
  const scale=Math.min(1,maxSide/Math.max(w,h));
  w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
  const canvas=document.createElement('canvas');
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(bmp,0,0,w,h);
  bmp.close&&bmp.close();
  const preferPng=file.type==='image/png'||file.type==='image/gif';
  const mime=preferPng&&(w*h<900000)?'image/png':'image/jpeg';
  const blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('encode failed')),mime,quality));
  return blob;
}
function blobToDataUrl(blob){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(fr.result);
    fr.onerror=()=>rej(fr.error||new Error('read failed'));
    fr.readAsDataURL(blob);
  });
}

function cookFilterMatch(r){
  if(!r)return false;
  // All is the whole book: cooked meals and uncooked ideas (Sip & Feast and any other source).
  // Never-cooked recipes are not hidden behind the cooked filter.
  if(cookFilter==='all'||cookFilter==='meals'||cookFilter==null||cookFilter==='')return true;
  const s=stats(r);
  if(cookFilter==='fresh'){
    if(!s.n||!s.last)return true;
    return (Date.now()-new Date(s.last))/864e5>14;

  if(cookFilter==='cooked')return s.n>0;
  if(cookFilter==='fav')return isFav(r.id);
  if(cookFilter==='later')return isLater(r.id);
  return true;
}

/* Recipe codes: PROTEIN letter + number, e.g. P-062 = pork · recipe #62.
   Letters follow the recipe's current tags; the number is its place in the order it was added and never changes.

function codePrefix(r){

function ensureRecipeCodes(){
  if(!Array.isArray(S.recipes)||!S.recipes.length)return false;
  let changed=false,max=0;const seen=new Set();
  S.recipes.forEach(r=>{if('code' in r){delete r.code;changed=true}});
  // duplicates (two devices numbering at once): keep the first by id, renumber the other
  [...S.recipes].sort((a,b)=>String(a.id).localeCompare(String(b.id))).forEach(r=>{
    const n=Number(r.seq);
    if(!(n>0)||!Number.isInteger(n)||seen.has(n)){if(r.seq!=null){delete r.seq;changed=true}return}
    seen.add(n);max=Math.max(max,n);

  todo.forEach(r=>{r.seq=++max;changed=true});

const ING_FRAC={'¼':.25,'⅓':1/3,'½':.5,'⅔':2/3,'¾':.75,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
const ING_UNIT_RE=/^(lbs?|pounds?|oz|ozs|ounces?|cups?|c|tbsps?|tbls?|tbs|tablespoons?|tsps?|teaspoons?|qts?|quarts?|l|liters?|litres?|kgs?|kilograms?|g|grams?|ml|mls|millilit(?:er|re)s?|cloves?|pinch(?:es)?|dash(?:es)?|cans?|tins?|slices?|blocks?|packets?|packages?|bunch(?:es)?|heads?|sprigs?|sticks?|pieces?|pcs?|jars?|bags?|box(?:es)?|handfuls?|ribs?|stalks?)$/i;

function isNutritionLine(line){
  const s=String(line||'').replace(/^[-•*]\s*/,'').trim();
  if(!s)return false;
  if(/^macros\b/i.test(s))return true;
  if(/^\d+\s*(calories|kcal)\b/i.test(s))return true;
  // "12 g fat", "3g sugars" are nutrition facts; "100 g sugar" alone could be an ingredient, so sugar needs a sibling hint.
  if(/^\d+\s*g\s+(fat|carbs?|carbohydrates?|protein|fiber|fibre|saturated|sodium)\b/i.test(s))return true;
  if(/^\d+\s*g\s+sugars\b/i.test(s)||/^\d+\s*g\s+(added\s+)?sugar\s*$/i.test(s)&&/^\d{1,2}\s*g/.test(s))return true;
  return false;

/** Drop bracketed metric conversions such as (907g). Keep a US size such as (16oz). */
function stripMetricAsides(line){

    .replace(/\s+/g,' ')

}

const DASH_QTY_RE=/^(\d+\s+\d+\/\d+|\d+\s*[¼⅓½⅔¾⅛⅜⅝⅞]|\d+\/\d+|[¼⅓½⅔¾⅛⅜⅝⅞]|\d*\.\d+|\d+)\s*([A-Za-z]+\.?)?(.*)$/;
function dashAmountLine(line){
  let t=String(line||'').replace(/\s+[—–-]\s*$/,'').replace(/\s*[—–]\s*$/,'');
  const m=t.match(/^(.*?[A-Za-z].*?)\s+[—–]\s+(.+)$/)||t.match(/^(.*?[A-Za-z].*?)\s+-\s+(.+)$/);
  if(!m)return t;
  const left=m[1].trim(),right=m[2].trim();
  const leftHasQty=/^(\d|[¼⅓½⅔¾⅛⅜⅝⅞])/.test(left);
  const q=right.match(DASH_QTY_RE);
  const unitOk=q&&(!q[2]||ING_UNIT_RE.test(q[2].replace(/\.$/,'')));
  if(!q||!unitOk){return leftHasQty?`${left}, ${right}`:`${left}, ${right}`}
  const tail=(q[3]||'').trim();
  const tailTxt=tail?(/^[,(]/.test(tail)?(tail[0]===','?tail:' '+tail):', '+tail):'';
  if(leftHasQty)return left+tailTxt;

function parseIngredientLine(line){

  if(!line||isNutritionLine(line))return null;
  if(isIngredientSectionHeading(line))return null; // part headings aren't ingredients (or grocery rows)
  let m=line.match(/^(\d+\s+\d+\/\d+|\d+\s*[¼⅓½⅔¾⅛⅜⅝⅞]|\d+\/\d+|[¼⅓½⅔¾⅛⅜⅝⅞]|\d*\.\d+|\d+)\s*(.*)$/);
  // "80/20 ground chuck" is a fat ratio, not an amount.
  if(m&&/^\d{2,}\/\d{2,}$/.test(m[1]))m=null;
  if(!m){
    // Amount written after the ingredient: "carrots 5 lb", "chicken thighs, 3lbs", "eggs x6", "onion (2)".
    const t=line.match(/^(.*?[A-Za-z].*?)[\s,:–-]+\(?\s*x?\s*(\d+\s+\d+\/\d+|\d+\s*[¼⅓½⅔¾⅛⅜⅝⅞]|\d+\/\d+|[¼⅓½⅔¾⅛⅜⅝⅞]|\d*\.\d+|\d+)\s*([A-Za-z]+)?\.?\s*\)?$/);
    if(t&&(!t[3]||ING_UNIT_RE.test(t[3]))&&!/^(serves|servings?|makes|yield|prep|cook|total)\b/i.test(t[1])){
      m=[null,t[2],(t[3]?t[3]+' ':'')+t[1].replace(/[\s,:–-]+$/,'')];
    }else return{qty:null,unit:'',item:line,meat:ING_MEAT_RE.test(line)};

  const um=rest.match(/^([A-Za-z]+)\b\s*(.*)$/);
  if(um&&ING_UNIT_RE.test(um[1])&&!(um[1].toLowerCase()==='c'&&!/^\.?\s/.test(rest.slice(1)))){unit=canonUnit(um[1]);rest=um[2].replace(/^\.\s*/,'').replace(/^of\s+(?!the\b|a\b|an\b|your\b)/i,'').trim()}
  rest=rest.replace(/\((\d[\d./]*)\s*(oz|ounce|ounces|lb|lbs|pound|pounds)\)/gi,(_,n,u)=>'('+n+' '+canonUnit(u)+')');
  const item=rest||line;
  return{qty,unit,item,meat:ING_MEAT_RE.test(item)};
}
function parseIngredientLines(text){

function qtyToLbs(qty,unit){
  if(qty==null||!Number.isFinite(qty))return null;
  const u=String(unit||'').trim().toLowerCase();
  if(canonUnit(u)==='lb')return qty;

function saveArchiveEdit(id){
  captureLiveDrafts();
  const r=S.recipes.find(x=>x.id===id);if(!r)return;
  const d=archiveEditDraft||{};
  const name=recipeTitle(String(d.name||'').trim());
  if(!name){showFieldError('ed-name','Add a name');return}
  const tags=canonicalTags(d.tags);
  stashArchiveEditSide();

  const originalRaw=String(archiveEditOriginal||'').trim();
  const scaledBase=scaledIngredientText(r).trim();
  const originalBase=originalIngredientText(r).trim();
  const scaledChanged=scaledRaw!==scaledBase;
  const originalChanged=originalRaw!==originalBase;
  const steps=cleanSteps(String(d.steps||'').split('\n').map(x=>x.trim()).filter(Boolean));
  const notes=String(d.notes||'').trim();
  r.name=name;r.tags=tags;r.steps=steps;
  if(d.spice!=null)r.spice=Number(d.spice);
  if(d.funName!=null){const fn=String(d.funName).trim();if(fn)r.funName=fn;else delete r.funName;}
  if(notes)r.notes=notes;else delete r.notes;
  if(d.source!=null){const so=String(d.source).trim();if(so!==String(r.source||'').trim()){if(so)r.source=so;else delete r.source;delete r.sourceName}}
  if(!scaledChanged&&!originalChanged){
    wipeIds(['ed-name','ed-tags','ed-ing','ed-notes','ed-steps']);
    archiveEditing=false;
    archiveEditDraft=null;
    archiveEditScale='scaled';
    archiveEditBase='';
    archiveEditScaled='';
    archiveEditOriginal='';
    save();
    if(finishPlanRecipeEdit())return;
    render();
    return;
  }
  // Scaled text is the batch, saved as typed. Do not divide it by the meat factor or write that reverse into src.
  // src changes only when the Original side itself was edited.
  const warns=[];
  if(originalChanged){
    const parsed=itemsFromEditText(originalRaw);
    if(parsed.warnings.length)warns.push(...parsed.warnings);
    if(parsed.items.length){
      const items=parsed.items;
      const computed=meatLbsFromItems(items);
      const prev=r.src&&typeof r.src==='object'?r.src:{};
      const meatLbs=computed!=null?computed:(prev.meatLbs>0?prev.meatLbs:null);
      r.src={items,sections:parsed.sections,servings:prev.servings??null,meatLbs,meatNote:String(prev.meatNote||'')};
    }
  }
  if(scaledChanged){
    const parsed=itemsFromEditText(scaledRaw);
    if(parsed.warnings.length)warns.push(...parsed.warnings);
    r.ingredients=formatIngredientBlock(scaledRaw);
    r.batchCustom=true;
  }else if(originalChanged&&!r.batchCustom){
    if(r.src&&Array.isArray(r.src.items)&&r.src.items.length&&r.targetLbs&&r.src.meatLbs){
      const b=build(srcForDisplayScale(r),r.targetLbs);
      r.ingredients=b.text;
      r.servings=b.servings;
    }else if(r.src&&Array.isArray(r.src.items)&&r.src.items.length){
      r.ingredients=build(r.src,null).text;
      if(r.src.servings!=null)r.servings=r.src.servings;
    }else{
      r.ingredients=formatIngredientBlock(originalRaw);
    }
  }
  if(warns.length){
    archiveWarn='Quantity not read: '+warns.join(' · ');
    archiveWarnId=id;
  }else{
    archiveWarn='';archiveWarnId=null;
  }
  wipeIds(['ed-name','ed-tags','ed-ing','ed-notes','ed-steps']);
  archiveEditing=false;
  archiveEditDraft=null;
  archiveEditScale='scaled';
  archiveEditBase='';
  archiveEditScaled='';
  archiveEditOriginal='';
  save();
  if(finishPlanRecipeEdit())return;
  render();
}

function delRecipe(id){
  const idx=S.recipes.findIndex(r=>r&&r.id===id);
  if(idx<0)return;
  const recipe=JSON.parse(JSON.stringify(S.recipes[idx]));
  // Delete the image file only after the Undo window closes.
  let imgTimer=null;
  if(recipe.imageUrl&&String(recipe.imageUrl).startsWith('/images/')){
    imgTimer=setTimeout(()=>{
      if(!S.recipes.some(r=>r&&r.id===id))fetch('api/image?id='+encodeURIComponent(id),{method:'DELETE'}).catch(()=>{});
    },7500);
  }
  const mealsBefore=JSON.parse(JSON.stringify(S.meals||[]));
  S.meals=(S.meals||[]).map(m=>({...m,items:(m.items||[]).filter(i=>i.rid!==id)})).filter(m=>m.items.length);
  const placements=[];
  (S.weeks||[]).forEach(w=>{
    slotsOf(w).forEach(slot=>{
      const p=w[slot];if(!p||!Array.isArray(p.items))return;
      p.items.forEach((it,i)=>{if(it&&it.rid===id)placements.push({weekOf:w.weekOf,slot,idx:i,item:JSON.parse(JSON.stringify(it))})});
    });
  });
  S.recipes=S.recipes.filter(r=>r.id!==id);
  (S.weeks||[]).forEach(w=>{
    slotsOf(w).forEach(slot=>{
      const p=w[slot];if(!p||!Array.isArray(p.items))return;
      p.items=p.items.filter(i=>i.rid!==id);
    });
  });
  if(S.plan&&typeof S.plan==='object'){
    Object.keys(S.plan).forEach(d=>{
      const p=S.plan[d];if(!p)return;
      if(Array.isArray(p.items)){p.items=p.items.filter(i=>i.rid!==id);if(!p.items.length&&!p.note)delete S.plan[d]}
      else if(p.rid===id)delete S.plan[d];
    });
  }
  if(archiveOpenId===id){archiveOpenId=null;archiveEditing=false}
  save();
  showToast('Removed',()=>{
    clearTimeout(imgTimer);
    S.meals=mealsBefore;
    if(!S.recipes.some(r=>r&&r.id===id))S.recipes.splice(Math.min(idx,S.recipes.length),0,recipe);
    placements.forEach(pl=>{
      const w=(S.weeks||[]).find(x=>x.weekOf===pl.weekOf);if(!w)return;
      if(!w[pl.slot]||typeof w[pl.slot]!=='object')w[pl.slot]={items:[]};
      if(!Array.isArray(w[pl.slot].items))w[pl.slot].items=[];
      w[pl.slot].items.splice(Math.min(pl.idx,w[pl.slot].items.length),0,pl.item);
    });
    archiveOpenId=id;
    save();render();
  });
  render();
}
/** Latest cook Sunday this recipe was on a plate (not after today); else the latest planned one. */
function lastPlannedCookDay(rid){
  const days=[];(S.weeks||[]).forEach(w=>slotsOf(w).forEach(sl=>{if(((w[sl]&&w[sl].items)||[]).some(i=>i&&i.rid===rid))days.push(slotDate(w,sl))}));days.sort();
  if(!days.length)return '';
  const t=today();const past=days.filter(d=>d<=t);
  return past.length?past[past.length-1]:days[days.length-1];
}

function saveCook(){
  let note=$('#cn')?($('#cn').value||'').trim():'';
  const rids=draft.rids&&draft.rids.length?draft.rids:(draft.rid?[draft.rid]:[]);
  // Prefer date picker; from a week plate, default was draft.weekOf (never silently use today)
  const picked=$('#cd')&&$('#cd').value;
  const cookDate=picked||draft.weekOf||draft.cookDate||today();
  // Recipes only in the cook log; loose ingredients stay in the plate note if present
  if(draft.ingNote&&!note.toLowerCase().includes(String(draft.ingNote).toLowerCase())){
    note=note?(note+(note.endsWith('.')?' ':' · ')+'Also on plate: '+draft.ingNote):('Also on plate: '+draft.ingNote);
  }
  const pushed=[];let updated=0;
  rids.forEach(rid=>{
    const r=S.recipes.find(x=>x.id===rid);
    const existing=(S.log||[]).find(l=>l&&l.rid===rid&&l.date===cookDate);
    if(existing){
      if(draft.rating)existing.rating=draft.rating;
      if(note)existing.note=note;
      updated++;return;
    }
    const row={id:uid(),rid,name:r?r.name:'Meal',date:cookDate,note};
    if(draft.rating)row.rating=draft.rating;
    S.log.push(row);pushed.push(row);
  });
  // Keep lunch/dinner plate on the week plan; only write cook log
  if(draft.weekId||draft.weekOf){
    const w=(S.weeks||[]).find(x=>x.id===draft.weekId)||(S.weeks||[]).find(x=>x.weekOf===draft.weekOf);
    if(w&&draft.slot&&Array.isArray((w[draft.slot]||{}).items)){
      // re-assert slot object so merge never drops it as missing
      w[draft.slot]={items:[...(w[draft.slot].items||[])],...(w[draft.slot].note?{note:w[draft.slot].note}:{})};
    }
  }
  if(rids.length===1)cookedOpenRid=rids[0];
  else if(rids.length)cookedOpenRid=rids[0];
  draft={rating:0};cookLogRid=null;S.updatedAt=Date.now();save({flush:true});render();
  if(pushed.length)showToast(`Logged · ${friendlyDate(cookDate)}`,()=>{S.log=S.log.filter(l=>!pushed.includes(l));save({flush:true});render()});
  else if(updated)showToast(`Already logged ${friendlyDate(cookDate)} · note updated`);
}

/* Markdown for assistant replies: headings, bold/italic/strike, inline + fenced code,
   bullet / numbered / nested lists, task boxes, quotes, tables, rules, links. Text is escaped first. */
function mdInline(t){
  const codes=[];
  t=t.replace(/`([^`\n]+)`/g,(m,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  t=t.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/__(.+?)__/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,'$1<em>$2</em>').replace(/(^|[\s(])_(?!\s)(.+?)_(?=[\s).,!?:;]|$)/g,'$1<em>$2</em>');
  t=t.replace(/~~(.+?)~~/g,'<del>$1</del>');
  return t.replace(/\u0000(\d+)\u0000/g,(m,n)=>'<code>'+codes[+n]+'</code>');
}
function chatMarkdown(text){
  const raw=String(text||'').replace(/```recipe\s*[\s\S]*?```/g,'').replace(/\r\n?/g,'\n').trim();
  if(!raw)return '';
  const L=esc(raw).split('\n');
  const out=[];let i=0;
  const isTableSep=l=>/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l);
  const cells=l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>mdInline(c.trim()));
  const listRe=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  while(i<L.length){
    const l=L[i];
    if(/^\s*```/.test(l)){const code=[];i++;while(i<L.length&&!/^\s*```/.test(L[i]))code.push(L[i++]);i++;out.push('<pre><code>'+code.join('\n')+'</code></pre>');continue}
    if(!l.trim()){i++;continue}
    let m;
    if((m=l.match(/^(#{1,6})\s+(.*)$/))){const lv=Math.min(4,m[1].length+1);out.push(`<h${lv}>${mdInline(m[2])}</h${lv}>`);i++;continue}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){out.push('<hr>');i++;continue}
    if(/^\s*&gt;/.test(l)){const q=[];while(i<L.length&&/^\s*&gt;/.test(L[i]))q.push(L[i++].replace(/^\s*&gt;\s?/,''));out.push('<blockquote>'+chatMarkdown(q.join('\n').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'"))+'</blockquote>');continue}
    if(l.includes('|')&&i+1<L.length&&isTableSep(L[i+1])){
      const head=cells(l);i+=2;const rows=[];
      while(i<L.length&&L[i].includes('|')&&L[i].trim())rows.push(cells(L[i++]));
      out.push('<div class="md-table"><table><thead><tr>'+head.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>');continue}
    if(listRe.test(l)){
      // nested lists by indentation
      let html='';const stack=[];
      while(i<L.length&&(listRe.test(L[i])||(L[i].trim()&&/^\s{2,}/.test(L[i])&&stack.length))){
        const mm=L[i].match(listRe);
        if(!mm){html=html.replace(/<\/li>$/,'')+'<br>'+mdInline(L[i].trim())+'</li>';i++;continue}
        const ind=mm[1].length,tag=/\d/.test(mm[2])?'ol':'ul';
        while(stack.length&&ind<stack[stack.length-1].ind){html+=`</${stack.pop().tag}></li>`}
        if(!stack.length||ind>stack[stack.length-1].ind){
          if(stack.length)html=html.replace(/<\/li>$/,'');
          const start=tag==='ol'&&parseInt(mm[2])>1?` start="${parseInt(mm[2])}"`:'';
          html+=`<${tag}${start}>`;stack.push({ind,tag});
        }
        let body=mm[3];const task=body.match(/^\[( |x|X)\]\s+(.*)$/);
        body=task?`<span class="md-task${task[1].trim()?' done':''}">${task[1].trim()?'☑':'☐'}</span> ${mdInline(task[2])}`:mdInline(body);
        html+=`<li>${body}</li>`;i++;
      }
      while(stack.length){const t=stack.pop();html+=`</${t.tag}>`+(stack.length?'</li>':'')}
      out.push(html);continue}
    const para=[];
    while(i<L.length&&L[i].trim()&&!/^\s*```/.test(L[i])&&!/^(#{1,6})\s/.test(L[i])&&!listRe.test(L[i])&&!/^\s*&gt;/.test(L[i])&&!(L[i].includes('|')&&i+1<L.length&&isTableSep(L[i+1])))para.push(L[i++]);
    out.push('<p>'+para.map(mdInline).join('<br>')+'</p>');
  }
  return out.join('');
}

}
async function sendChat(){
  captureLiveDrafts();
  const t=String(chatText||'').trim();
  if(!t||busy)return;
  chat.push({role:'user',content:t});
  chatSyncSession();
  chatText='';

  busy=true;
  chatConfirmNew=false;
  render();

    const r=await fetch('api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chat.filter(m=>!m.error).slice(-20),context:ctx(),provider:chatProvider})});
    if(!r.ok)throw 0;
    const j=await r.json();
    if(j&&j.error)throw new Error(j.error);
    if(!j||typeof j.reply!=='string'||!j.reply.trim())throw 0;
    chat.push({role:'assistant',content:j.reply});
    chatSyncSession();
  }catch(e){
    chatSyncSession();
    chat.push({role:'assistant',error:true,content:(e&&e.message)?String(e.message):'Check your connection or pick another model below.'});
  }
  busy=false;
  skipScrollRestore=true;
  render();
  window.scrollTo(0,document.body.scrollHeight);
  const box=$('#ct');
  if(box){try{box.focus({preventScroll:true})}catch(err){try{box.focus()}catch(e2){}}}

function retryChat(i){

/** Phrase -> {count (your data), unit (usual unit)}; words -> frequency. Cached per data shape. */

/** Optimal string alignment distance (typos incl. swapped letters), capped. */
function editDistance(a,b,cap=3){

function acSuggestItem(typed,opts={}){

  if(q.length<(opts.unitsOnly?1:2)||/[,()]/.test(q))return null;
  if(opts.unitsOnly||(opts.unitSlot&&!/\s/.test(q)&&q.length<=3)){

/** Fix misspelled words in an ingredient name. Returns {text,fixes}. */
function acFixWords(name){
  const {words}=acIndex();

  const text=String(name||'').replace(/[A-Za-z][A-Za-z'’-]*/g,w=>{
    const low=w.toLowerCase();
    if(low.length<4||/['’]/.test(low)||words.has(low))return w;
    if(low.endsWith('s')&&words.has(low.slice(0,-1)))return w;
    if(words.has(low+'s'))return w;

      // or one wrong letter in a longer word. Never shorten a word (spring→sprig) or swap one
      // letter in a short word (rest→zest): those are usually real, different words.
      if(v.length<low.length)return;

/** Clean formatting + spelling for one ingredient line. Headings/nutrition lines pass through. */

  if(!body)return{text:'',fixes:[]};
  if(isIngredientSectionHeading(body))return{text:headingText(body),fixes:[]};
  if(isNutritionLine(body))return{text:formatIngredientLine(raw),fixes:[]};
  const lead=(raw.match(/^\s*[-•*]\s*/)||[''])[0].trim();

function autoFixIngredientBlock(text){

const AC_FIELDS={'pi-text':'item','pie-text':'item','pi-unit':'unit','pie-unit':'unit','pn-ings':'lines','ed-ing':'lines','ri':'lines'};

  if(el.id==='pi-text'||el.id==='pie-text')acAutofillQtyUnit(el);
  if(AC_FIELDS[el.id]&&document.activeElement===el)acRender(el);
});
document.addEventListener('keydown',e=>{
  if(!acState||e.target!==acState.el)return;
  if(e.key==='Tab'&&!e.shiftKey){if(acAccept())e.preventDefault();return}
  if(e.key==='ArrowRight'&&e.target.selectionEnd===e.target.value.length){if(acAccept())e.preventDefault();return}
  if(e.key==='Escape'){acHide();e.stopPropagation();return}
},true);
['click','keyup'].forEach(t=>document.addEventListener(t,e=>{
  const el=e.target;
  if(el&&AC_FIELDS[el.id]&&!(t==='keyup'&&/^(Tab|Shift)$/.test(e.key)))acRender(el);
}));
document.addEventListener('focusout',e=>{
  if(acState&&e.target===acState.el)setTimeout(()=>{if(acState&&document.activeElement!==acState.el)acHide()},120);
  autoFixTextareaOnBlur(e.target,e.relatedTarget);
});
document.addEventListener('pointerdown',e=>{
  if(acState&&e.target.closest&&e.target.closest('.ac-mirror')){e.preventDefault();acAccept()}
},true);
window.addEventListener('scroll',()=>{if(acState)acRender(acState.el)},true);
window.addEventListener('resize',()=>{if(acState)acRender(acState.el)});
/** Recipe ingredient boxes: clean + spell-fix every line when you leave the box. */
function autoFixTextareaOnBlur(el,next){
  if(!el||!['pn-ings','ed-ing','ri'].includes(el.id))return;
  const before=el.value;
  if(!before.trim())return;
  const r=autoFixIngredientBlock(before);
  if(r.text===before)return;
  el.value=r.text;
  el.dispatchEvent(new Event('input',{bubbles:true}));
  if(el.id==='ed-ing'&&archiveEditDraft)archiveEditDraft.ing=r.text;
  if(el.id==='pn-ings')planNewDraft.ings=r.text;
  const id=el.id;
  // Leaving the box by pressing a button (Save, Cancel…): just keep the tidied text, no toast.
  if(next&&next.closest&&next.closest('button'))return;
  // Otherwise show the toast a beat later, so it can never land on top of the button being clicked.
  setTimeout(()=>showToast(r.fixes.length?`Fixed: ${fixesLabel(r.fixes)}`:'Cleaned up ingredient formatting',()=>{
    const n=document.getElementById(id);
    if(!n){showToast('Already saved. Edit the recipe to change it back.');return}
    n.value=before;
    n.dispatchEvent(new Event('input',{bubbles:true}));
    if(id==='ed-ing'&&archiveEditDraft)archiveEditDraft.ing=before;
    if(id==='pn-ings')planNewDraft.ings=before;
  }),350);
}

/* ---------- ingredient parts (Marinade:, Sauce:) + paste cleanup ---------- */
/** Text of a part heading as stored/shown: upper case, no trailing colon. */
function headingText(s){
  return String(s||'').replace(/^[-•*]\s*/,'').trim().replace(/\s*:\s*$/,'').toUpperCase();
}
/** Broken UTF-8 pasted as Latin-1 ("2â€“3", "Â½") back to the real characters. */
const MOJIBAKE=[['â€“','–'],['â€”','—'],['â€˜','‘'],['â€™','’'],['â€œ','“'],['â€\u009d','”'],['â€','”'],['â€¦','…'],['Â½','½'],['Â¼','¼'],['Â¾','¾'],['Â°','°'],['Â ',' '],['Ã©','é'],['Ã¨','è'],['Ã ','à'],['Ã±','ñ'],['Ã¼','ü'],['Ã¶','ö'],['Ã§','ç'],['Ã¹','ù'],['Ã¬','ì'],['Ã²','ò'],['Â','']];
function fixMojibake(t){
  let s=String(t==null?'':t);
  if(!/[âÂÃ]/.test(s))return s;
  MOJIBAKE.forEach(([a,b])=>{s=s.split(a).join(b)});
  return s;
}
const LIST_MARK_RE=/^\s*(?:[-–—•·*▢☐□✓✔▪●◦○■]+\s*)+/;
/** Strip "1.", "1)", "Step 1:" (repeated, e.g. "1. 1.") from the start of a method step. */
function cleanStep(s){
  let t=fixMojibake(s).replace(LIST_MARK_RE,'').trim();
  for(let i=0;i<3;i++){
    const n=t.replace(/^(?:step\s*)?\d{1,2}\s*[.):\-–]\s+/i,'').replace(/^step\s*\d{1,2}\s*$/i,'');
    if(n===t)break; t=n.trim();
  }
  return t.replace(/\s{2,}/g,' ');
}
function cleanSteps(list){return (list||[]).map(cleanStep).filter(Boolean)}
/** Light cleanup for pasted ingredient lists: encoding, bullets, list numbers, doubled numbers. */
function cleanIngredientPaste(text){
  let lines=fixMojibake(text).replace(/\r\n?/g,'\n').split('\n').map(l=>l.replace(/\t/g,' ').replace(/\s{2,}/g,' ').trim());
  lines=lines.map(l=>l.replace(LIST_MARK_RE,''));
  // "1. 2 tbsp soy" / "3) garlic": list numbering with a dot or bracket
  lines=lines.map(l=>l.replace(/^\d{1,2}\s*[.)]\s+(?=\S)/,''));
  // bare numbering "1 2 tbsp", "2 3 cloves" when the leading numbers run 1,2,3… down the list
  const lead=lines.map(l=>{const m=l.match(/^(\d{1,2})\s+(?=[\d¼⅓½⅔¾⅛⅜⅝⅞])/);return m?Number(m[1]):null});
  const numbered=lead.filter(v=>v!=null);
  if(numbered.length>=3&&numbered.every((v,i)=>v===i+1))lines=lines.map((l,i)=>lead[i]!=null?l.replace(/^\d{1,2}\s+/,''):l);
  // the same number twice in a row ("2 2 tbsp") — keep one
  lines=lines.map(l=>l.replace(/^(\d+)\s+\1(?=\s+[A-Za-z])/,'$1'));
  // drop blank runs
  const out=[];lines.forEach(l=>{if(l||(out.length&&out[out.length-1]))out.push(l)});
  while(out.length&&!out[out.length-1])out.pop();
  return out.join('\n');
}
function cleanStepsPaste(text){
  return fixMojibake(text).replace(/\r\n?/g,'\n').split('\n').map(l=>l.trim()).filter(Boolean).map(cleanStep).filter(Boolean).join('\n');
}
const PASTE_FIELDS={'rs':'steps','pn-steps':'steps','ed-ing':'ing','ri':'ing','pn-ings':'ing','pi-text':'ing','pie-text':'ing','ed-steps':'steps','ed-notes':'text','ed-name':'text','rn':'text','pn-name':'text'};
document.addEventListener('paste',e=>{
  const el=e.target;const kind=el&&PASTE_FIELDS[el.id];
  if(!kind||!e.clipboardData)return;
  const raw=e.clipboardData.getData('text/plain');if(!raw)return;
  let clean=kind==='ing'?cleanIngredientPaste(raw):kind==='steps'?cleanStepsPaste(raw):fixMojibake(raw);
  if(el.tagName==='INPUT')clean=clean.replace(/\s*\n\s*/g,' ');
  if(clean===raw)return;
  e.preventDefault();
  el.focus();
  let ok=false;try{ok=document.execCommand('insertText',false,clean)}catch(x){}
  if(!ok){el.setRangeText(clean,el.selectionStart,el.selectionEnd,'end');el.dispatchEvent(new Event('input',{bubbles:true}))}
});
/** Insert a new part heading at the cursor (own line) and select its name for typing. */
function insertIngPart(id){
  const el=document.getElementById(id);if(!el)return;
  const v=el.value,pos=el.selectionEnd??v.length;
  const lineEnd=v.indexOf('\n',pos)<0?v.length:v.indexOf('\n',pos);
  const before=v.slice(0,lineEnd),after=v.slice(lineEnd);
  const pre=before&&!before.endsWith('\n')?'\n':'';
  const name='Part name';
  el.value=before+pre+name+':\n'+after.replace(/^\n/,'');
  const start=before.length+pre.length;
  el.focus();try{el.setSelectionRange(start,start+name.length)}catch(x){}
  el.dispatchEvent(new Event('input',{bubbles:true}));
}
/** Ingredient block as HTML: part headings styled, everything else escaped as-is. */
function ingredientBlockHtml(text){
  return String(text||'').split('\n').map(l=>isIngredientSectionHeading(l)?`<span class="ing-sec">${esc(headingText(l))}</span>`:esc(l)).join('\n');
}

const taHeights={};
function render(){
  refreshTagCanon();
  syncMeAvatar();
  if(archiveOpenId||planSheetId)loadSharedReviews();

  captureLiveDrafts();

  document.querySelectorAll('.sheet-scroll[data-scroll-key]').forEach(el=>{innerScroll[el.dataset.scrollKey]=el.scrollTop});

  $('#main').classList.toggle('anim',tab!==lastAnimTab);lastAnimTab=tab;

  const asBar=(typeof window!=='undefined'&&window.MP_GUEST)?`<div class="demo-strip" role="status"><span>${prefs().onboarded?'Your plan isn’t saved yet':'Demo · nothing is saved'}</span><button type="button" class="link-btn" onclick="openSignIn('${prefs().onboarded?'plan':''}')">${prefs().onboarded?'Save it':'Sign in'}</button></div>`:'';
  syncAsSel();

  if(restoreId){
    const n=document.getElementById(restoreId);
    if(n){
      try{n.focus({preventScroll:true})}catch(e){try{n.focus()}catch(e2){}}
      if(sel&&restoreId===activeId&&n.setSelectionRange){
        try{n.setSelectionRange(sel.s,sel.e)}catch(e){}
      }
    }
  }
  syncPlanSheet();
  syncCookMode();

  document.querySelectorAll('.sheet-scroll[data-scroll-key]').forEach(el=>{
    const k=el.dataset.scrollKey;
    if(k in innerScroll){el.style.scrollBehavior='auto';el.scrollTop=innerScroll[k];el.style.scrollBehavior=''}
    el.closest('.scroll-card')?.classList.toggle('is-scrolled',el.scrollTop>8);
  });
  if(!skipScrollRestore)window.scrollTo(0,y);
  skipScrollRestore=false;
}

  if(document.visibilityState==='hidden')saveFlush();
  else save({flush:true}); // coming back: pick up edits made on other devices
